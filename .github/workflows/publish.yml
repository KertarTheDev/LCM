name: publish
run-name: "${{ format('{0} {1}', inputs.pre_release && 'pre-release' || 'release', inputs.bump) }}"

on:
  # push:
  #   branches:
  #     - ci
  #     - dev
  #     - beta
  #     - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional)"
        required: false
        type: string
      # kilocode_change start
      pre_release:
        description: "Publish as pre-release (VS Code marketplace + npm rc channel)"
        required: false
        type: boolean
        default: true
      # kilocode_change end

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  issues: write # kilocode_change - label automated JetBrains CLI pin bump PRs
  packages: write
  pull-requests: write # kilocode_change - create automated JetBrains CLI pin bump PRs

jobs:
  # kilocode_change start - verify and publish LCM prerelease assets from the fork-only branch
  lcm-prerelease-artifacts:
    name: LCM prerelease artifacts
    if: github.repository == 'KertarTheDev/LCM' && github.ref == 'refs/heads/kilocode-lcm-prerelease'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Verify exact product ancestry and overlay
        run: |
          base="$(node -p "require('./package.json').version.split('-')[0]")"
          git fetch --no-tags origin \
            "+refs/heads/kilocode-lcm-v${base}:refs/remotes/origin/kilocode-lcm-v${base}"
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" verify-overlay \
            --base-ref "origin/kilocode-lcm-v${base}" \
            --head-ref "$GITHUB_SHA"
          bun run script/check-opencode-annotations.ts --base "origin/kilocode-lcm-v${base}"
          bun run script/check-workflows.ts

      - name: Verify v7.4.23 adaptation seams
        run: |
          cd "$GITHUB_WORKSPACE/packages/opencode"
          bun test \
            test/kilocode/lcm/upstream-compat.test.ts \
            test/kilocode/lcm/prompt-seam.test.ts \
            test/kilocode/lcm/tui-command.test.ts \
            --timeout 120000
          bun test \
            test/event-manifest.test.ts \
            test/kilocode/lcm/api-contracts.test.ts \
            --timeout 120000
          bun test test/session/processor-effect.test.ts \
            -t 'external context management|upstream policy' \
            --timeout 180000
          bun test test/kilocode/lcm/transcript-source.test.ts \
            -t 'a later successful provider step consumes sequential and parallel LCM tool results' \
            --timeout 120000
          bun test test/kilocode/lcm/tool-contracts.test.ts --timeout 120000
          bun test test/kilocode/agent-permission-overrides.test.ts \
            -t 'Conversation Memory' \
            --timeout 120000
          bun test test/kilocode/sessions/remote-command.test.ts -t 'compact' \
            --timeout 120000
          bun test test/kilocode/sessions/remote-sender.test.ts \
            -t 'send_command rejects process exit before ACK without invoking command or graceful exit' \
            --timeout 120000
          bun run --cwd "$GITHUB_WORKSPACE/packages/opencode" lcm:contracts:check
          bun run --cwd "$GITHUB_WORKSPACE/packages/opencode" lcm:docs:check
          cd "$GITHUB_WORKSPACE/packages/kilo-vscode"
          bunx eslint --no-cache \
            src/KiloProvider.ts \
            src/kilo-provider/early-message.ts \
            src/kilo-provider/conversation-memory.ts \
            src/services/cli-backend/connection-utils.ts \
            src/shared/custom-provider.ts \
            tests/unit/connection-utils.test.ts \
            tests/unit/conversation-memory-export.test.ts \
            tests/unit/custom-provider-dialog-validate.test.ts \
            tests/unit/custom-provider.test.ts \
            tests/unit/i18n-keys.test.ts \
            tests/unit/kilo-provider-load-messages.test.ts \
            tests/unit/lcm-ui.test.ts \
            webview-ui/src/components/chat/ContextProgress.tsx \
            webview-ui/src/components/chat/TaskHeader.tsx \
            webview-ui/src/components/chat/TaskTimeline.tsx \
            webview-ui/src/components/settings/ContextTab.tsx \
            webview-ui/src/components/settings/CustomProviderDialog.tsx \
            webview-ui/src/components/settings/CustomProviderModelCard.tsx \
            webview-ui/src/components/settings/CustomProviderValidation.ts \
            webview-ui/src/components/settings/ExperimentalTab.tsx \
            webview-ui/src/context/lcm-state.ts \
            webview-ui/src/context/session.tsx \
            webview-ui/src/types/messages/config.ts \
            webview-ui/src/types/messages/extension-messages.ts \
            webview-ui/src/types/messages/index.ts \
            webview-ui/src/types/messages/lcm.ts \
            webview-ui/src/types/messages/webview-messages.ts
          bun test \
            tests/unit/conversation-memory-export.test.ts \
            tests/unit/connection-utils.test.ts \
            tests/unit/early-message.test.ts \
            tests/unit/lcm-ui.test.ts \
            --timeout 120000
          bun test \
            tests/unit/custom-provider.test.ts \
            tests/unit/custom-provider-dialog-validate.test.ts \
            --timeout 120000
          bun test tests/unit/kilo-provider-load-messages.test.ts --timeout 120000
          bun test tests/unit/i18n-keys.test.ts --timeout 120000
          node --test "$GITHUB_WORKSPACE/script/lcm-prerelease-release.test.mjs"

      - name: Typecheck affected packages
        run: |
          bun run --cwd "$GITHUB_WORKSPACE/packages/opencode" typecheck
          bun run --cwd "$GITHUB_WORKSPACE/packages/sdk/js" typecheck
          bun run --cwd "$GITHUB_WORKSPACE/packages/kilo-i18n" typecheck
          bun run --cwd "$GITHUB_WORKSPACE/packages/tui" typecheck
          bun run --cwd "$GITHUB_WORKSPACE/packages/kilo-vscode" typecheck
          bun run --cwd "$GITHUB_WORKSPACE/packages/kilo-vscode" check-kilocode-change

      - name: Prove generated contracts are stable
        run: |
          bun run script/generate.ts
          git diff --exit-code

      - name: Compute LCM prerelease version
        id: alpha
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base="${INPUT_VERSION:-}"
          if [ -z "$base" ]; then
            base="$(node -p "require('./package.json').version")"
          fi
          base="${base#v}"
          base="${base%%-*}"
          node -e 'const semver = require("semver"); const base = process.argv[1]; if (!semver.valid(base)) { console.error(`Invalid upstream base version: ${base}`); process.exit(1); }' "$base"
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" next-version \
            --repo "$GITHUB_REPOSITORY" \
            --base "$base" \
            --sha "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"

      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build CLI archives
        env:
          KILO_VERSION: ${{ steps.alpha.outputs.version }}
          KILO_PRE_RELEASE: "true"
          KILO_RELEASE: "1"
          KILO_RELEASE_ARCHIVE_ONLY: "true"
        run: bun run --cwd "$GITHUB_WORKSPACE/packages/opencode" build

      - name: Install VSIX packager
        run: bun install -g @vscode/vsce

      - name: Build VSIX packages
        env:
          CLI_DIST_DIR: ${{ github.workspace }}/packages/opencode/dist
          KILO_VERSION: ${{ steps.alpha.outputs.version }}
          KILO_PRE_RELEASE: "true"
        run: bun script/build.ts
        working-directory: packages/kilo-vscode

      - name: Smoke packaged Linux x64 Conversation Memory runtime
        run: |
          snapshot="$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-linux-x64.vsix"
          bun run --cwd "$GITHUB_WORKSPACE/packages/opencode" lcm:packaged-smoke -- --vsix "$snapshot"

      - name: Upload CLI archives as workflow artifact
        uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: kilo-cli-${{ steps.alpha.outputs.version }}
          path: |
            ${{ github.workspace }}/packages/opencode/dist/kilo-*.tar.gz
            ${{ github.workspace }}/packages/opencode/dist/kilo-*.zip

      - name: Upload VSIX files as workflow artifact
        uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: kilo-vscode-${{ steps.alpha.outputs.version }}
          path: ${{ github.workspace }}/packages/kilo-vscode/out/*.vsix

      - name: Create exact draft prerelease
        id: release
        env:
          BASE: ${{ steps.alpha.outputs.base }}
          TAG: ${{ steps.alpha.outputs.tag }}
          VERSION: ${{ steps.alpha.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/lcm-prerelease-notes.md"
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" write-notes \
            --base "$BASE" \
            --tag "$TAG" \
            --sha "$GITHUB_SHA" \
            --output-file "$notes"
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" create-draft \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --sha "$GITHUB_SHA" \
            --title "LCM prerelease $VERSION" \
            --body-file "$notes" \
            --output "$GITHUB_OUTPUT"

      - name: Upload exact prerelease asset manifest
        run: |
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" upload-assets \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.release.outputs.id }}" \
            --tag "${{ steps.alpha.outputs.tag }}" \
            --sha "$GITHUB_SHA" \
            --profile lcm-prerelease \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-arm64.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-x64.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-x64-baseline.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-arm64-musl.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-x64-musl.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-linux-x64-baseline-musl.tar.gz" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-darwin-arm64.zip" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-darwin-x64.zip" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-darwin-x64-baseline.zip" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-windows-arm64.zip" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-windows-x64.zip" \
            --asset "$GITHUB_WORKSPACE/packages/opencode/dist/kilo-windows-x64-baseline.zip" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-linux-x64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-linux-arm64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-alpine-x64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-alpine-arm64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-darwin-x64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-darwin-arm64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-win32-x64.vsix" \
            --asset "$GITHUB_WORKSPACE/packages/kilo-vscode/out/kilo-vscode-win32-arm64.vsix"

      - name: Validate draft prerelease
        run: |
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" validate-release \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.release.outputs.id }}" \
            --tag "${{ steps.alpha.outputs.tag }}" \
            --sha "$GITHUB_SHA" \
            --profile lcm-prerelease \
            --body-file "$RUNNER_TEMP/lcm-prerelease-notes.md" \
            --draft true

      - name: Publish exact prerelease
        run: |
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" publish \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.release.outputs.id }}" \
            --tag "${{ steps.alpha.outputs.tag }}" \
            --sha "$GITHUB_SHA" \
            --title "LCM prerelease ${{ steps.alpha.outputs.version }}" \
            --body-file "$RUNNER_TEMP/lcm-prerelease-notes.md" \
            --profile lcm-prerelease

      - name: Clean failed draft prerelease
        if: failure() && steps.release.outputs.id != ''
        run: |
          node "$GITHUB_WORKSPACE/script/lcm-prerelease-release.mjs" cleanup \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.release.outputs.id }}" \
            --tag "${{ steps.alpha.outputs.tag }}" \
            --sha "$GITHUB_SHA"
  # kilocode_change end
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # kilocode_change start - install deps for version script workspace resolution
      - name: Install dependencies
        run: bun install

      - name: Install Kilo
        if: inputs.bump || inputs.version
        run: bun i -g @kilocode/cli
      # kilocode_change end

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KILO_BUMP: ${{ inputs.bump }}
          KILO_VERSION: ${{ inputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      # kilocode_change start
      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      # kilocode_change end
      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # kilocode_change start - pack dist tree into a single zstd-compressed tar before upload.
      # download-artifact@v4's streaming unzip is CPU-bound and processes entries one by one;
      # collapsing ~480 files into one tar cuts build-vscode download from >30m to seconds.
      # zstd compresses the wasms (~4x) and leaves the already-compact binaries alone, for
      # ~1 GB artifact. upload-artifact@v7's `archive: false` skips the zip wrapper entirely
      # so the tarball travels as-is (download-artifact@v8 auto-detects via Content-Type).
      # With `archive: false` the `name:` input is ignored; the artifact is named after the
      # file (kilo-cli.tar.zst). zstd + GNU tar are preinstalled on both github-hosted and
      # blacksmith ubuntu-2404. See actions/upload-artifact#36, actions/toolkit#1533.
      - name: Pack CLI dist into tar.zst
        run: |
          find packages/opencode/dist -name '*.map' -delete
          tar --zstd -cf /tmp/kilo-cli.tar.zst -C packages/opencode/dist .

      - uses: actions/upload-artifact@v7
        with:
          path: /tmp/kilo-cli.tar.zst
          archive: false
      # kilocode_change end

    outputs:
      version: ${{ needs.version.outputs.version }}

  # kilocode_change start - execute supported Unix CLI binaries before packaging VSIX artifacts
  validate-cli-unix:
    name: Validate CLI (${{ matrix.target }})
    needs: build-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            uname: arm64
            package: "@kilocode/cli-darwin-arm64"
            mode: host
          - target: darwin-x64
            runner: macos-15-intel
            uname: x86_64
            package: "@kilocode/cli-darwin-x64"
            mode: host
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@kilocode/cli-linux-arm64"
            mode: host
          - target: linux-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@kilocode/cli-linux-x64"
            mode: host
          - target: alpine-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@kilocode/cli-linux-arm64-musl"
            mode: alpine
            platform: linux/arm64
          - target: alpine-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@kilocode/cli-linux-x64-musl"
            mode: alpine
            platform: linux/amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C dist

      - name: Run CLI smoke test
        run: |
          test "$(uname -m)" = "${{ matrix.uname }}"

          smoke_host() {
            binary="$1"
            "$binary" --version
            helper="$(dirname "$binary")/bwrap"
            if [[ "${{ matrix.target }}" == linux-* ]]; then
              test -x "$helper"
              grep -q '^SPDX-License-Identifier: LGPL-2.0-or-later$' "$(dirname "$binary")/licenses/bubblewrap/NOTICE"
              "$helper" --version
              # The live user-namespace bootstrap depends on the runner's kernel/AppArmor policy
              # (GitHub-hosted Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1), not on
              # the shipped artifact. The runtime probe degrades gracefully, so keep this check non-fatal.
              "$helper" --unshare-user --disable-userns --unshare-pid --die-with-parent --new-session \
                --ro-bind / / --dev /dev --proc /proc -- "$helper" --version \
                || echo "unprivileged user namespaces unavailable on this runner; skipping live sandbox check"
            fi
            root="$(mktemp -d)"
            trap 'rm -rf "$root"' RETURN
            (
              unset KILO_MODELS_PATH KILO_MODELS_URL KILO_CONFIG KILO_CONFIG_DIR
              export XDG_DATA_HOME="$root/data"
              export XDG_CACHE_HOME="$root/cache"
              export XDG_CONFIG_HOME="$root/config"
              export XDG_STATE_HOME="$root/state"
              export KILO_DISABLE_MODELS_FETCH=1
              export KILO_DISABLE_PROJECT_CONFIG=1
              export KILO_CONFIG_CONTENT='{"enabled_providers":["anthropic"]}'
              export ANTHROPIC_API_KEY=dummy
              "$binary" --pure models anthropic | grep -q '^anthropic/'
            )
          }

          if [ "${{ matrix.mode }}" = "host" ]; then
            smoke_host "./dist/${{ matrix.package }}/bin/kilo"
            exit 0
          fi

          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD/dist:/dist:ro" \
            -e PACKAGE="${{ matrix.package }}" \
            alpine:3.22 \
            sh -c '
              set -eu
              # kilocode_change start - Bun musl binaries link against libstdc++ and libgcc_s
              # (GCC C++ runtime). Alpine does not ship these by default; they are available
              # as optional packages and must be installed for any Bun-compiled musl binary to run.
              apk add --no-cache libstdc++ libgcc
              # kilocode_change end
              binary="/dist/$PACKAGE/bin/kilo" # kilocode_change
              "$binary" --version # kilocode_change
              "/dist/$PACKAGE/bin/bwrap" --version # kilocode_change
              grep -q '\''^SPDX-License-Identifier: LGPL-2.0-or-later$'\'' "/dist/$PACKAGE/bin/licenses/bubblewrap/NOTICE" # kilocode_change
              root="$(mktemp -d)"
              trap '\''rm -rf "$root"'\'' EXIT
              unset KILO_MODELS_PATH KILO_MODELS_URL KILO_CONFIG KILO_CONFIG_DIR
              export XDG_DATA_HOME="$root/data"
              export XDG_CACHE_HOME="$root/cache"
              export XDG_CONFIG_HOME="$root/config"
              export XDG_STATE_HOME="$root/state"
              export KILO_DISABLE_MODELS_FETCH=1
              export KILO_DISABLE_PROJECT_CONFIG=1
              export KILO_CONFIG_CONTENT='\''{"enabled_providers":["anthropic"]}'\''
              export ANTHROPIC_API_KEY=dummy
              "$binary" --pure models anthropic | grep -q "^anthropic/"
            '

  validate-cli-windows:
    name: Validate CLI (windows-${{ matrix.arch }})
    needs: build-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20 # kilocode_change
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            package: "@kilocode/cli-windows-arm64"
          - arch: x64
            runner: windows-2025
            package: "@kilocode/cli-windows-x64"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true

      - name: Install zstd
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstandard -y --no-progress
          }

      - name: Unpack CLI dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          zstd -d --stdout "$env:RUNNER_TEMP\kilo-cli.tar.zst" | tar -xf - -C dist

      - name: Run CLI smoke test
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}".Replace("/", "\")
          $binary = ".\dist\$package\bin\kilo.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          try {
            foreach ($name in "KILO_MODELS_PATH", "KILO_MODELS_URL", "KILO_CONFIG", "KILO_CONFIG_DIR") {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            $env:XDG_DATA_HOME = Join-Path $root "data"
            $env:XDG_CACHE_HOME = Join-Path $root "cache"
            $env:XDG_CONFIG_HOME = Join-Path $root "config"
            $env:XDG_STATE_HOME = Join-Path $root "state"
            $env:KILO_DISABLE_MODELS_FETCH = "1"
            $env:KILO_DISABLE_PROJECT_CONFIG = "1"
            $env:KILO_CONFIG_CONTENT = '{"enabled_providers":["anthropic"]}'
            $env:ANTHROPIC_API_KEY = "dummy"
            $output = & $binary --pure models anthropic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($output -match "(?m)^anthropic/")) {
              throw "Compiled Windows binary did not list Anthropic models from the embedded snapshot"
            }
          } finally {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }
  # kilocode_change end
  build-vscode:
    needs:
      - build-cli
      - validate-cli-unix
      - validate-cli-windows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      # kilocode_change start - download into /tmp and extract the tar.zst packed by build-cli
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C packages/opencode/dist
      # kilocode_change end
      - name: Build VSIX packages
        run: bun script/build.ts
        working-directory: ./packages/kilo-vscode
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist
          KILO_VERSION: ${{ needs.build-cli.outputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

  # kilocode_change start
  # Run smoke tests against CLI assets uploaded to the draft GitHub release
  # before publishing the release and package artifacts.
  smoke-test:
    name: Smoke Test (pre-publish gate)
    needs:
      - version
      - build-cli
    if: github.repository == 'Kilo-Org/kilocode'
    uses: ./.github/workflows/smoke-test.yml
    with:
      cli_version: ${{ needs.version.outputs.version }}
    secrets: inherit
  # kilocode_change end

  publish:
    needs:
      - version
      - build-cli
      - build-vscode
      - validate-cli-unix # kilocode_change
      - validate-cli-windows # kilocode_change
      - smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        # kilocode_change start
        with:
          persist-credentials: false
        # kilocode_change end

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # kilocode_change

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # kilocode_change start
          kilo-maintainer-app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          kilo-maintainer-app-secret: ${{ secrets.KILO_MAINTAINER_APP_SECRET }}
          # kilocode_change end

      # kilocode_change start - download into /tmp and extract the tar.zst packed by build-cli
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C packages/opencode/dist
      # kilocode_change end
      - uses: actions/download-artifact@v8
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

      - name: Cache apt packages (AUR)
        uses: actions/cache@v5 # kilocode_change
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "kilo-maintainer[bot]@users.noreply.github.com"
          git config --global user.name "kilo-maintainer[bot]"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OPENVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
