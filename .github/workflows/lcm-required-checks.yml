# kilocode_change - new file
name: LCM required checks

on:
  pull_request:
    paths:
      - "packages/core/src/session/context-engine.ts"
      - "packages/core/src/session/context-epoch.ts"
      - "packages/core/src/session/compaction.ts"
      - "packages/core/test/session-*.test.ts"
      - "packages/kilo-memory/**"
      - "packages/llm/src/**"
      - "packages/llm/test/adapter.test.ts"
      - "packages/opencode/src/session/**"
      - "packages/opencode/src/provider/**"
      - "packages/opencode/src/plugin/**"
      - "packages/opencode/src/server/**"
      - "packages/opencode/src/config/**"
      - "packages/opencode/src/effect/app-runtime.ts"
      - "packages/opencode/src/cli/cmd/debug/**"
      - "packages/opencode/src/kilocode/cli/cmd/tui/**"
      - "packages/opencode/src/kilocode/memory/**"
      - "packages/opencode/src/kilocode/provider/**"
      - "packages/opencode/src/kilocode/server/httpapi/**"
      - "packages/opencode/src/kilocode/session/**"
      - "packages/opencode/src/kilocode/swe-pruner.ts"
      - "packages/opencode/src/kilocode/tool/**"
      - "packages/opencode/src/tool/**"
      - "packages/opencode/test/lcm/**"
      - "packages/opencode/test/kilocode/memory/**"
      - "packages/opencode/test/kilocode/recall-search.test.ts"
      - "packages/opencode/test/kilocode/session-compaction-*.test.ts"
      - "packages/opencode/test/kilocode/session-prompt-compaction-safety.test.ts"
      - "packages/opencode/test/kilocode/swe-pruner.test.ts"
      - "packages/opencode/test/session/prompt.test.ts"
      - "packages/opencode/script/build.ts"
      - "packages/opencode/script/build-node.ts"
      - "packages/opencode/script/lcm-*.ts"
      - "packages/opencode/package.json"
      - "packages/sdk/**"
      - "packages/tui/src/**"
      - "packages/kilo-vscode/esbuild.js"
      - "packages/kilo-vscode/script/**"
      - "packages/kilo-vscode/src/**"
      - "packages/kilo-vscode/webview-ui/src/**"
      - "packages/kilo-vscode/tests/unit/lcm-*.test.ts"
      - "packages/kilo-vscode/package.json"
      - ".github/workflows/lcm-required-checks.yml"
      - ".github/workflows/lcm-macos-platform-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime contracts and memory behavior
    runs-on: blacksmith-8vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Contract check
        working-directory: packages/opencode
        run: bun run lcm:contracts:check

      - name: Migration smoke
        working-directory: packages/opencode
        run: bun run lcm:migration:smoke

      - name: Activation and raw leaf parity
        working-directory: packages/opencode
        run: |
          bun run lcm:activation
          bun run lcm:raw-leaf-parity

      - name: Finalized source and active context
        working-directory: packages/opencode
        run: |
          bun run lcm:finalized-sync
          bun run lcm:active-context:test

      - name: Provider-safe assembly and protocol
        working-directory: packages/opencode
        run: |
          bun run lcm:provider-assembly
          bun run lcm:provider-protocol
          bun run lcm:provider-overflow
          bun run lcm:assembly-token-budget

      - name: Retrieval authorization and path provenance
        working-directory: packages/opencode
        run: |
          bun run lcm:retrieval-auth
          bun run lcm:retrieval-tools
          bun run lcm:path-provenance

      - name: Durable map contracts and agentic runtime
        working-directory: packages/opencode
        run: |
          bun run lcm:map
          bun run lcm:sub-agent-scope
          bun run lcm:agentic-map-runtime

      - name: Hard-limit and cutover boundary
        working-directory: packages/opencode
        run: |
          bun run lcm:hard-limit
          bun run lcm:cutover-quarantine

      - name: Prompt static check
        working-directory: packages/opencode
        run: bun run lcm:prompt-static

      - name: System context composition
        working-directory: packages/opencode
        run: bun run lcm:system-context

      - name: Upstream memory compatibility
        run: |
          bun run --cwd packages/kilo-memory test
          bun run --cwd packages/opencode test \
            test/kilocode/memory/memory-integration.test.ts \
            test/kilocode/recall-search.test.ts \
            test/kilocode/session-prompt-compaction-safety.test.ts \
            test/kilocode/swe-pruner.test.ts \
            --timeout 60000

      - name: Context-engine seam
        run: |
          bun run --cwd packages/core test test/session-runner.test.ts
          bun run --cwd packages/llm test test/adapter.test.ts
          bun run --cwd packages/opencode test test/session/llm.test.ts --timeout 60000

      - name: Runtime typecheck
        working-directory: packages/opencode
        run: bun run typecheck

  vscode:
    name: vscode settings and compile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: LCM settings UI tests
        working-directory: packages/kilo-vscode
        run: |
          bun run lcm:settings-ui
          bun run lcm:context-ui

      - name: VSCode compile
        working-directory: packages/kilo-vscode
        run: bun run compile
